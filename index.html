<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#161a2b">

<title>Pocket Arcade</title>
<style>
:root{--bg:#161a2b;--panel:#20253c;--ink:#ecebf5;--mut:#9b9db8;--label:#12142a}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",sans-serif;min-height:100vh;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.wrap{max-width:920px;margin:0 auto;padding:28px 16px 48px}

h1{margin:0;font:800 clamp(2rem,6vw,3.2rem)/1 ui-monospace,Consolas,monospace;letter-spacing:-.03em}
header p{margin:8px 0 0;color:var(--mut);max-width:46ch}
button{font:inherit;cursor:pointer}
.ghost{background:var(--panel);color:var(--ink);border:2px solid #343a5c;border-radius:8px;padding:6px 14px}
:focus-visible{outline:3px solid #f2c94c;outline-offset:3px}
#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}
.cart{position:relative;border:0;background:var(--c);border-radius:14px 14px 6px 6px;padding:34px 12px 12px;text-align:left;color:var(--label);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.cart:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.cart i{position:absolute;left:12px;right:12px;top:10px;height:16px;border-radius:3px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 6px,transparent 6px 12px)}
.lab{background:var(--label);border-radius:6px;padding:12px;min-height:122px;display:flex;flex-direction:column;gap:6px}
.lab b{font:800 1.3rem/1.1 ui-monospace,Consolas,monospace;color:var(--c)}
.lab span{color:#c9cbe0;font-size:.9rem;line-height:1.35}
.lab em{margin-top:auto;font-style:normal;color:var(--mut);font-size:.85rem}

.bar h2{margin:0;font:800 1.2rem ui-monospace,Consolas,monospace;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hud b{color:var(--ink)}

.screen{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}

#pad .row2{grid-auto-flow:column;grid-auto-columns:minmax(64px,auto)}#pad .one button{min-width:120px}
#dlg{position:fixed;inset:0;z-index:20;background:rgba(10,12,24,.82);display:flex;align-items:center;justify-content:center;padding:16px}

.card h3{margin:0 0 4px;font:800 1.4rem ui-monospace,Consolas,monospace}

.pri{background:#f2c94c!important;color:#12142a!important;border:0!important;border-radius:8px;padding:6px 14px;font-weight:700}
#upd{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:30;max-width:420px;margin:0 auto;background:#f2c94c;color:#12142a;border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
#upd button{background:#12142a;color:#f2c94c;border:0;border-radius:8px;padding:8px 14px}
#pad button{min-width:64px;min-height:64px;font:700 26px system-ui,sans-serif;background:#2c3253;color:var(--ink);border:2px solid #3b4270;border-radius:14px;touch-action:none}
#pad button:active{background:var(--c);color:#12142a}
canvas{display:block;touch-action:none;border-radius:8px;background:#181c32;box-shadow:0 0 0 3px var(--c),0 10px 30px rgba(0,0,0,.45)}
#hint{text-align:center;color:var(--mut);margin:8px auto 0;max-width:60ch;font-size:.88rem;line-height:1.35}
footer{margin-top:36px;color:var(--mut);font-size:.9rem}

const snake={n:'Snake',c:'#7bd88f',w:320,h:320,blurb:'Eat, grow, and don’t bite yourself.',hint:'Arrow keys or WASD to steer. On touch, swipe in the direction you want to go.',

/* ---------- Tetris ---------- */
const P={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
const PC={I:'#5ad1e6',O:'#f2c94c',T:'#b57bee',S:'#7bd88f',Z:'#ef6f6c',J:'#6f8cf2',L:'#f2994a'};
const tetris={n:'Tetris',c:'#b57bee',w:240,h:480,blurb:'Stack falling blocks and clear lines.',hint:'Left and right to move, up to rotate, down to speed up, Space to drop. On touch: tap rotates, swipe sideways moves, swipe down drops.',
init(){this.b=Array.from({length:20},()=>Array(10).fill(0));this.sc=0;this.ln=0;this.a=0;this.over=0;this.bag=[];this.spawn()},
spawn(){if(!this.bag.length)this.bag=Object.keys(P).sort(()=>Math.random()-.5);this.k=this.bag.pop();this.m=P[this.k].map(r=>[...r]);this.px=(10-this.m[0].length)/2|0;this.py=0;if(this.hit(this.m,this.px,this.py)){this.over=1;beep(120,.3);save(this.n,this.sc)}},

let g=this.py;while(!this.hit(this.m,this.px,g+1))g++;
this.m.forEach((r,j)=>r.forEach((v,i)=>{if(!v)return;R((this.px+i)*24+3,(g+j)*24+3,18,18,'#262b47');R((this.px+i)*24+1,(this.py+j)*24+1,22,22,PC[this.k])}))}};

/* ---------- Dino Run ---------- */
const dino={n:'Dino Run',c:'#f2c94c',w:360,h:300,instant:1,blurb:'Jump the cacti and run as far as you can.',hint:'Space or up arrow to jump, or tap anywhere on the screen. The longer you run, the faster it gets.',
init(){this.y=0;this.vy=0;this.o=[];this.t=0;this.sp=.28;this.sc=0;this.over=0;this.nx=380},

/* ---------- Pong ---------- */
const pong={n:'Pong',c:'#6f8cf2',w:320,h:480,blurb:'Outlast the computer paddle.',hint:'Drag, A and D, or the arrow keys move your paddle. Score as many points as you can before missing five times.',
