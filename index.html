<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#161a2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pocket Arcade</title>
<style>
:root{--bg:#161a2b;--panel:#20253c;--ink:#ecebf5;--mut:#9b9db8;--label:#12142a}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:28px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{margin:0;font:800 clamp(2rem,6vw,3.2rem)/1 ui-monospace,Consolas,monospace;letter-spacing:-.03em}
header p{margin:8px 0 0;color:var(--mut);max-width:46ch}
button{font:inherit;cursor:pointer}
.ghost{background:var(--panel);color:var(--ink);border:2px solid #343a5c;border-radius:8px;padding:6px 14px}
:focus-visible{outline:3px solid #f2c94c;outline-offset:3px}
#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.cart{position:relative;border:0;background:var(--c);border-radius:14px 14px 6px 6px;padding:34px 12px 12px;text-align:left;color:var(--label);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.cart:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.cart i{position:absolute;left:12px;right:12px;top:10px;height:16px;border-radius:3px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 6px,transparent 6px 12px)}
.lab{background:var(--label);border-radius:6px;padding:12px;min-height:122px;display:flex;flex-direction:column;gap:6px}
.lab b{font:800 1.3rem/1.1 ui-monospace,Consolas,monospace;color:var(--c)}
.lab span{color:#c9cbe0;font-size:.9rem;line-height:1.35}
.lab em{margin-top:auto;font-style:normal;color:var(--mut);font-size:.85rem}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{margin:0;font:800 1.5rem ui-monospace,Consolas,monospace;flex:1}
.hud{display:flex;gap:18px;color:var(--mut);font:600 1rem ui-monospace,Consolas,monospace}
.hud b{color:var(--ink)}
.screen{display:flex;justify-content:center}
canvas{display:block;touch-action:none;border:4px solid;border-radius:8px;background:#181c32;image-rendering:pixelated;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#hint{text-align:center;color:var(--mut);margin:14px auto 0;max-width:60ch}
footer{margin-top:36px;color:var(--mut);font-size:.9rem}
</style></head><body><div class="wrap">
<div id="home">
<header><div><h1>Pocket Arcade</h1><p>Ten classics in one file. Open it, play, and never think about Wi‑Fi.</p></div>
<button class="ghost" id="snd">Sound: on</button></header>
<main id="shelf"></main>
<footer>High scores are saved in this browser. Press Esc during a game to return here.</footer>
</div>
<section id="stage" hidden>
<div class="bar"><button class="ghost" id="back">Back to shelf</button><h2 id="gt"></h2>
<div class="hud"><span>Score <b id="sc">0</b></span><span>Best <b id="best">0</b></span></div></div>
<div class="screen"><canvas id="c" width="320" height="320"></canvas></div>
<p id="hint"></p>
</section></div>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),x=cv.getContext('2d');
const R=(a,b,w,h,c)=>{x.fillStyle=c;x.fillRect(a,b,w,h)};
const Tx=(t,a,b,s,c,al)=>{x.fillStyle=c;x.font='bold '+s+'px ui-monospace,Consolas,monospace';x.textAlign=al||'center';x.fillText(t,a,b)};
const best=n=>{try{return+localStorage.getItem('pa_'+n)||0}catch(e){return 0}};
const save=(n,s)=>{s=Math.floor(s);if(s>best(n))try{localStorage.setItem('pa_'+n,s)}catch(e){}};
let ac,mute=0;
const beep=(f,d)=>{if(mute)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}};

/* ---------- Tic-Tac-Toe ---------- */
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const ttt={n:'Tic-Tac-Toe',c:'#ef6f6c',w:300,h:350,blurb:'Three in a row against a sharp but fallible computer.',hint:'Click or tap a square, or press 1–9. You are X. The computer slips up now and then, so wins are possible.',
init(){this.sc=0;this.l=0;this.d=0;this.reset()},
reset(){this.b=Array(9).fill(0);this.res=null},
win(b){for(const[a,c,d]of L)if(b[a]&&b[a]==b[c]&&b[a]==b[d])return b[a];return b.includes(0)?null:'d'},
mm(b,t){const r=this.win(b);if(r)return r=='O'?1:r=='X'?-1:0;let v=t=='O'?-2:2;for(let i=0;i<9;i++)if(!b[i]){b[i]=t;const s=this.mm(b,t=='O'?'X':'O');b[i]=0;v=t=='O'?Math.max(v,s):Math.min(v,s)}return v},
ai(){const e=[];for(let i=0;i<9;i++)if(!this.b[i])e.push(i);if(Math.random()<.3)return e[Math.random()*e.length|0];let bi=e[0],bv=-2;for(const i of e){this.b[i]='O';const v=this.mm(this.b,'X');this.b[i]=0;if(v>bv){bv=v;bi=i}}return bi},
chk(){const r=this.win(this.b);if(!r)return;this.res=r;if(r=='X'){this.sc++;save(this.n,this.sc);beep(780,.2)}else if(r=='O'){this.l++;beep(140,.25)}else this.d++},
tap(px,py){if(this.res){this.reset();return}if(py>=300)return;const i=(px/100|0)+3*(py/100|0);if(this.b[i])return;this.b[i]='X';beep(520,.05);this.chk();if(!this.res){this.b[this.ai()]='O';beep(330,.05);this.chk()}},
key(k){if(k>='1'&&k<='9')this.tap((k-1)%3*100+50,((k-1)/3|0)*100+50);else if(k==' '||k=='Enter')if(this.res)this.reset()},
update(){},
draw(){R(0,0,300,350,'#181c32');x.strokeStyle='#3b4270';x.lineWidth=4;x.lineCap='round';x.beginPath();for(let i=1;i<3;i++){x.moveTo(i*100,10);x.lineTo(i*100,290);x.moveTo(10,i*100);x.lineTo(290,i*100)}x.stroke();
this.b.forEach((v,i)=>{const cx=i%3*100+50,cy=(i/3|0)*100+50;x.lineWidth=10;if(v=='X'){x.strokeStyle='#ef6f6c';x.beginPath();x.moveTo(cx-22,cy-22);x.lineTo(cx+22,cy+22);x.moveTo(cx+22,cy-22);x.lineTo(cx-22,cy+22);x.stroke()}else if(v=='O'){x.strokeStyle='#5ad1e6';x.beginPath();x.arc(cx,cy,26,0,7);x.stroke()}});
Tx(this.res?(this.res=='X'?'You win! Tap to play again':this.res=='O'?'Computer wins. Tap to retry':'A draw. Tap to play again'):'Your move',150,322,15,'#ecebf5');
Tx('Wins '+this.sc+'   Losses '+this.l+'   Draws '+this.d,150,342,12,'#9b9db8')}};

/* ---------- Snake ---------- */
const snake={n:'Snake',c:'#7bd88f',w:320,h:320,blurb:'Eat, grow, and don’t bite yourself.',hint:'Arrow keys or WASD to steer. On touch, swipe in the direction you want to go.',
init(){this.s=[[10,10],[9,10],[8,10]];this.d=[1,0];this.q=[];this.f=this.food();this.a=0;this.sc=0;this.over=0},
food(){let p;do p=[Math.random()*20|0,Math.random()*20|0];while(this.s.some(s=>s[0]==p[0]&&s[1]==p[1]));return p},
turn(d){const l=this.q.length?this.q[this.q.length-1]:this.d;if(this.q.length<3&&(l[0]+d[0]||l[1]+d[1]))this.q.push(d)},
key(k){const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[k];if(m)this.turn(m)},
swipe(d){this.turn(d)},
update(dt){if(this.over)return;this.a+=dt;if(this.a<105)return;this.a=0;if(this.q.length)this.d=this.q.shift();const h=[this.s[0][0]+this.d[0],this.s[0][1]+this.d[1]];
if(h[0]<0||h[1]<0||h[0]>19||h[1]>19||this.s.some(s=>s[0]==h[0]&&s[1]==h[1])){this.over=1;beep(120,.3);save(this.n,this.sc);return}
this.s.unshift(h);if(h[0]==this.f[0]&&h[1]==this.f[1]){this.sc+=10;this.f=this.food();beep(660,.08)}else this.s.pop()},
draw(){R(0,0,320,320,'#181c32');for(let i=0;i<20;i++)for(let j=0;j<20;j++)if((i+j)%2)R(i*16,j*16,16,16,'#1b2036');R(this.f[0]*16+2,this.f[1]*16+2,12,12,'#ef6f6c');this.s.forEach((p,i)=>R(p[0]*16+1,p[1]*16+1,14,14,i?'#7bd88f':'#c8f7d2'))}};

/* ---------- Tetris ---------- */
const P={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
const PC={I:'#5ad1e6',O:'#f2c94c',T:'#b57bee',S:'#7bd88f',Z:'#ef6f6c',J:'#6f8cf2',L:'#f2994a'};
const tetris={n:'Tetris',c:'#b57bee',w:240,h:480,blurb:'Stack falling blocks and clear lines.',hint:'Left and right to move, up to rotate, down to speed up, Space to drop. On touch: tap rotates, swipe sideways moves, swipe down drops.',
init(){this.b=Array.from({length:20},()=>Array(10).fill(0));this.sc=0;this.ln=0;this.a=0;this.over=0;this.bag=[];this.spawn()},
spawn(){if(!this.bag.length)this.bag=Object.keys(P).sort(()=>Math.random()-.5);this.k=this.bag.pop();this.m=P[this.k].map(r=>[...r]);this.px=(10-this.m[0].length)/2|0;this.py=0;if(this.hit(this.m,this.px,this.py)){this.over=1;beep(120,.3);save(this.n,this.sc)}},
hit(m,px,py){return m.some((r,j)=>r.some((v,i)=>v&&(px+i<0||px+i>9||py+j>19||this.b[py+j][px+i])))},
mv(d){if(!this.hit(this.m,this.px+d,this.py))this.px+=d},
rot(){const m=this.m[0].map((_,i)=>this.m.map(r=>r[i]).reverse());for(const d of[0,-1,1,-2,2])if(!this.hit(m,this.px+d,this.py)){this.m=m;this.px+=d;return}},
drop(){if(!this.hit(this.m,this.px,this.py+1))this.py++;else this.lock()},
lock(){this.m.forEach((r,j)=>r.forEach((v,i)=>v&&(this.b[this.py+j][this.px+i]=PC[this.k])));const nb=this.b.filter(r=>r.some(v=>!v)),n=20-nb.length;while(nb.length<20)nb.unshift(Array(10).fill(0));this.b=nb;if(n){this.sc+=[0,100,300,500,800][n];this.ln+=n;beep(520+n*100,.12)}else beep(200,.04);this.spawn()},
key(k){if(k=='ArrowLeft'||k=='a')this.mv(-1);else if(k=='ArrowRight'||k=='d')this.mv(1);else if(k=='ArrowDown'||k=='s'){this.drop();this.sc++}else if(k=='ArrowUp'||k=='w')this.rot();else if(k==' '){let g=0;while(!this.hit(this.m,this.px,this.py+1)){this.py++;g++}this.sc+=g*2;this.lock()}},
tap(){this.rot()},swipe(d){if(d[0])this.mv(d[0]);else if(d[1]>0)this.key(' ')},
update(dt){if(this.over)return;this.a+=dt;if(this.a>Math.max(90,800-(this.ln/10|0)*70)){this.a=0;this.drop()}},
draw(){R(0,0,240,480,'#14172a');for(let j=0;j<20;j++)for(let i=0;i<10;i++){const v=this.b[j][i];if(v)R(i*24+1,j*24+1,22,22,v);else R(i*24+11,j*24+11,2,2,'#262b47')}
let g=this.py;while(!this.hit(this.m,this.px,g+1))g++;
this.m.forEach((r,j)=>r.forEach((v,i)=>{if(!v)return;R((this.px+i)*24+3,(g+j)*24+3,18,18,'#262b47');R((this.px+i)*24+1,(this.py+j)*24+1,22,22,PC[this.k])}))}};

/* ---------- Dino Run ---------- */
const dino={n:'Dino Run',c:'#f2c94c',w:640,h:200,blurb:'Jump the cacti and run as far as you can.',hint:'Space, up arrow, or a tap to jump. The longer you run, the faster it gets.',
init(){this.y=0;this.vy=0;this.o=[];this.t=0;this.sp=.28;this.sc=0;this.over=0;this.nx=500},
key(k){if(k==' '||k=='ArrowUp'||k=='w')this.tap()},
tap(){if(this.y==0){this.vy=.62;beep(440,.06)}},
update(dt){if(this.over)return;this.vy-=.0021*dt;this.y+=this.vy*dt;if(this.y<=0){this.y=0;this.vy=0}
this.sp=Math.min(.7,.28+this.sc*.0004);this.t+=dt*this.sp;this.sc+=dt*this.sp*.02;
this.nx-=dt*this.sp;if(this.nx<=0){this.o.push({x:650,w:16+(Math.random()*3|0)*10,h:28+(Math.random()*22|0)});this.nx=320+Math.random()*320+this.sp*320}
this.o.forEach(o=>o.x-=dt*this.sp);this.o=this.o.filter(o=>o.x>-60);
if(this.o.some(o=>78>o.x+3&&52<o.x+o.w-3&&this.y<o.h-4)){this.over=1;beep(120,.3);save(this.n,this.sc)}},
draw(){R(0,0,640,200,'#20243a');R(0,160,640,2,'#6b6f94');for(let i=0;i<11;i++)R(i*70-this.t%70,174,22,2,'#343a5c');
this.o.forEach(o=>{const t=160-o.h;R(o.x+o.w/2-4,t,8,o.h,'#7bd88f');R(o.x,160-o.h*.55,o.w,5,'#7bd88f');R(o.x,160-o.h*.75,6,o.h*.25,'#7bd88f');R(o.x+o.w-6,160-o.h*.75,6,o.h*.25,'#7bd88f')});
const g=160-this.y,f=(this.t/18|0)%2&&!this.y;R(46,g-20,8,6,'#f2c94c');R(52,g-26,24,18,'#f2c94c');R(62,g-34,16,12,'#f2c94c');R(72,g-31,3,3,'#20243a');R(55,g-8,6,8,'#f2c94c');R(67,g-8,6,f?4:8,'#f2c94c')}};

/* ---------- Pong ---------- */
const pong={n:'Pong',c:'#6f8cf2',w:480,h:320,blurb:'Outlast the computer paddle.',hint:'W and S, the arrow keys, or dragging moves your paddle. Score as many points as you can before missing five times.',
init(){this.py=this.ay=160;this.sc=0;this.miss=0;this.over=0;this.h={};this.serve(1)},
serve(d){this.bx=240;this.by=160;this.vx=.27*d;this.vy=(Math.random()-.5)*.24},
key(k){this.h[k]=1},up(k){this.h[k]=0},move(a,b){this.py=Math.max(30,Math.min(290,b))},
update(dt){if(this.over)return;const h=this.h,d=!!(h.ArrowDown||h.s)-!!(h.ArrowUp||h.w);this.py=Math.max(30,Math.min(290,this.py+d*.4*dt));
const as=Math.min(.26,.14+this.sc*.008)*dt,tg=this.vx>0?this.by:160;this.ay=Math.max(30,Math.min(290,this.ay+Math.max(-as,Math.min(as,tg-this.ay))));
this.bx+=this.vx*dt;this.by+=this.vy*dt;if(this.by<4||this.by>316){this.vy=-this.vy;this.by=Math.max(4,Math.min(316,this.by))}
if(this.vx<0&&this.bx<26&&this.bx>10&&Math.abs(this.by-this.py)<36){this.vx=Math.min(.6,-this.vx*1.06);this.vy=(this.by-this.py)/36*.3;this.bx=26;beep(500,.05)}
if(this.vx>0&&this.bx>454&&this.bx<470&&Math.abs(this.by-this.ay)<36){this.vx=-this.vx;this.vy=(this.by-this.ay)/36*.3;this.bx=454;beep(400,.05)}
if(this.bx<0){this.miss++;beep(120,.2);if(this.miss>=5){this.over=1;save(this.n,this.sc)}else this.serve(1)}
else if(this.bx>480){this.sc++;beep(800,.08);this.serve(-1)}},
draw(){R(0,0,480,320,'#181c32');for(let i=0;i<320;i+=20)R(238,i,4,10,'#2c3253');R(16,this.py-30,8,60,'#ecebf5');R(456,this.ay-30,8,60,'#6f8cf2');R(this.bx-4,this.by-4,8,8,'#f2c94c');Tx(this.sc,120,44,36,'#3b4270');Tx('Lives '+(5-this.miss),360,44,22,'#3b4270')}};

/* ---------- Breakout ---------- */
const brk={n:'Breakout',c:'#f2994a',w:480,h:320,blurb:'Smash every brick with a bouncing ball.',hint:'Arrow keys, A and D, or dragging moves the paddle. You have three lives.',
init(){this.px=240;this.sc=0;this.lv=3;this.over=0;this.h={};this.spd=1;this.fill();this.rs()},
fill(){this.br=[];for(let j=0;j<5;j++)for(let i=0;i<8;i++)this.br.push({x:i*60+2,y:44+j*20,j,a:1})},
rs(){this.bx=this.px;this.by=290;this.vx=.2*this.spd*(Math.random()<.5?-1:1);this.vy=-.28*this.spd},
key(k){this.h[k]=1},up(k){this.h[k]=0},move(a){this.px=Math.max(32,Math.min(448,a))},
update(dt){const h=this.h;this.px=Math.max(32,Math.min(448,this.px+(!!(h.ArrowRight||h.d)-!!(h.ArrowLeft||h.a))*.45*dt));
this.bx+=this.vx*dt;this.by+=this.vy*dt;
if(this.bx<4||this.bx>476){this.vx=-this.vx;this.bx=Math.max(4,Math.min(476,this.bx))}
if(this.by<4){this.vy=Math.abs(this.vy);this.by=4}
if(this.vy>0&&this.by>292&&this.by<306&&Math.abs(this.bx-this.px)<38){this.vy=-Math.abs(this.vy);this.vx=(this.bx-this.px)/38*.36*this.spd;this.by=292;beep(500,.04)}
for(const b of this.br)if(b.a&&this.bx>b.x-4&&this.bx<b.x+60&&this.by>b.y-4&&this.by<b.y+20){b.a=0;this.vy=-this.vy;this.sc+=10;beep(760-b.j*70,.04);break}
if(!this.br.some(b=>b.a)){this.spd*=1.1;this.fill();this.rs()}
if(this.by>326){this.lv--;beep(120,.2);if(this.lv<=0){this.over=1;save(this.n,this.sc)}else this.rs()}},
draw(){R(0,0,480,320,'#181c32');for(const b of this.br)if(b.a)R(b.x,b.y,56,16,['#ef6f6c','#f2994a','#f2c94c','#7bd88f','#5ad1e6'][b.j]);R(this.px-32,300,64,8,'#ecebf5');R(this.bx-4,this.by-4,8,8,'#f2c94c');Tx('Lives '+this.lv,440,24,16,'#6b6f94')}};

/* ---------- 2048 ---------- */
const t48={n:'2048',c:'#e8b04a',w:320,h:320,blurb:'Slide and merge tiles up to 2048.',hint:'Arrow keys or WASD slide the tiles. On touch, swipe. Equal tiles merge into one.',
init(){this.b=Array(16).fill(0);this.sc=0;this.over=0;this.msg='';this.add();this.add()},
add(){const e=[];this.b.forEach((v,i)=>v||e.push(i));if(e.length)this.b[e[Math.random()*e.length|0]]=Math.random()<.9?2:4},
mv(dx,dy){let m=0;for(let r=0;r<4;r++){const ix=[0,1,2,3].map(i=>dx?(dx>0?r*4+3-i:r*4+i):(dy>0?(3-i)*4+r:i*4+r));const l=ix.map(i=>this.b[i]).filter(v=>v);for(let i=0;i<l.length-1;i++)if(l[i]==l[i+1]){l[i]*=2;this.sc+=l[i];l.splice(i+1,1)}while(l.length<4)l.push(0);ix.forEach((p,i)=>{if(this.b[p]!=l[i]){m=1;this.b[p]=l[i]}})}
if(m){this.add();beep(400,.03);save(this.n,this.sc);if(!(this.b.includes(0)||this.b.some((v,i)=>(i%4<3&&v==this.b[i+1])||(i<12&&v==this.b[i+4])))){this.over=1;this.msg='No moves left'}}},
key(k){const d={ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0],ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1]}[k];if(d)this.mv(...d)},swipe(d){this.mv(...d)},update(){},
draw(){R(0,0,320,320,'#20243a');this.b.forEach((v,i)=>{const a=i%4*78+8,b=(i/4|0)*78+8;R(a,b,70,70,v?'hsl('+((Math.log2(v)*34+20)%360)+' 62% 60%)':'#2c3253');if(v)Tx(v,a+35,b+35+(v>999?9:12),v>999?22:v>99?28:34,'#12142a')})}};

/* ---------- Minesweeper ---------- */
const mine={n:'Minesweeper',c:'#5ad1e6',w:288,h:328,blurb:'Clear the field without hitting a mine.',hint:'Click to dig and right-click to flag. On touch, long-press to flag or tap the mode button in the top bar. Your first dig is always safe.',
init(){this.m=Array(81).fill(0);this.v=Array(81).fill(0);this.f=Array(81).fill(0);this.first=1;this.sc=0;this.over=0;this.msg='';this.fm=0},
nb(i){const r=i/9|0,c=i%9,o=[];for(let a=-1;a<2;a++)for(let b=-1;b<2;b++){const rr=r+a,cc=c+b;if((a||b)&&rr>=0&&rr<9&&cc>=0&&cc<9)o.push(rr*9+cc)}return o},
num(i){return this.nb(i).filter(j=>this.m[j]).length},
dig(i){if(this.v[i]||this.f[i])return;
if(this.first){this.first=0;const ex=[i,...this.nb(i)];let n=0;while(n<10){const k=Math.random()*81|0;if(!this.m[k]&&!ex.includes(k)){this.m[k]=1;n++}}}
if(this.m[i]){this.v.fill(1);this.over=1;this.msg='Boom!';beep(100,.4);save(this.n,this.sc);return}
const st=[i];while(st.length){const k=st.pop();if(this.v[k]||this.m[k])continue;this.v[k]=1;this.f[k]=0;this.sc++;if(!this.num(k))st.push(...this.nb(k))}
beep(500,.03);if(this.sc>=71){this.sc=100;this.over=1;this.msg='Field cleared!';save(this.n,this.sc)}},
cell(px,py){return py<40?-1:((py-40)/32|0)*9+(px/32|0)},
flag(i){if(i>=0&&!this.v[i])this.f[i]=this.f[i]?0:1},
tap(px,py){if(py<40){this.fm=!this.fm;return}const i=this.cell(px,py);this.fm?this.flag(i):this.dig(i)},
alt(px,py){this.flag(this.cell(px,py))},key(){},update(){},
draw(){R(0,0,288,328,'#181c32');Tx('Mines '+(10-this.f.reduce((a,b)=>a+b,0)),70,26,16,'#ecebf5');R(160,6,118,28,this.fm?'#ef6f6c':'#5ad1e6');Tx(this.fm?'Mode: Flag':'Mode: Dig',219,26,14,'#12142a');
for(let i=0;i<81;i++){const a=i%9*32,b=40+(i/9|0)*32;if(!this.v[i]){R(a+1,b+1,30,30,'#2c3253');if(this.f[i])R(a+9,b+9,14,14,'#ef6f6c')}else if(this.m[i]){R(a+1,b+1,30,30,'#4a2230');R(a+10,b+10,12,12,'#ef6f6c')}else{R(a+1,b+1,30,30,'#20243a');const n=this.num(i);if(n)Tx(n,a+16,b+23,18,['','#6f8cf2','#7bd88f','#ef6f6c','#b57bee','#f2994a','#5ad1e6','#ecebf5','#9b9db8'][n])}}}};

/* ---------- Flappy ---------- */
const flap={n:'Flappy',c:'#9be15d',w:360,h:480,blurb:'Tap to flap through the gaps.',hint:'Space, up arrow, click, or tap to flap. Don’t touch the pipes or the ground.',
init(){this.y=220;this.vy=0;this.p=[];this.nx=0;this.sc=0;this.over=0},
key(k){if(k==' '||k=='ArrowUp'||k=='w')this.tap()},tap(){this.vy=-.42;beep(600,.04)},
update(dt){if(this.over)return;this.vy+=.0015*dt;this.y+=this.vy*dt;this.nx-=dt*.15;
if(this.nx<=0){this.p.push({x:370,g:100+Math.random()*220,s:0});this.nx=190}
this.p.forEach(p=>{p.x-=dt*.15;if(!p.s&&p.x+54<80){p.s=1;this.sc++;beep(880,.05)}});this.p=this.p.filter(p=>p.x>-60);
if(this.y<8||this.y>438||this.p.some(p=>92>p.x&&68<p.x+54&&(this.y-12<p.g-65||this.y+12>p.g+65))){this.over=1;beep(120,.3);save(this.n,this.sc)}},
draw(){R(0,0,360,480,'#1b2140');this.p.forEach(p=>{R(p.x,0,54,p.g-65,'#7bd88f');R(p.x-4,p.g-85,62,20,'#5fbf72');R(p.x,p.g+65,54,400,'#7bd88f');R(p.x-4,p.g+65,62,20,'#5fbf72')});R(0,450,360,30,'#343a5c');
x.save();x.translate(80,this.y);x.rotate(Math.max(-.5,Math.min(.9,this.vy*2.2)));R(-13,-11,26,22,'#f2c94c');R(2,-8,6,6,'#fff');R(5,-6,3,3,'#12142a');R(8,0,10,5,'#f2994a');x.restore();Tx(this.sc,180,70,44,'#ecebf5')}};

/* ---------- Pac-Man ---------- */
const MZ=['###############','#o.....#.....o#','#.##.#...#.##.#','#.............#','#.##.#####.##.#','#.....#.#.....#','...............','#.....#.#.....#','#.##.#####.##.#','#.............#','#.##.#...#.##.#','#o.....#.....o#','###############'];
const pac={n:'Pac-Man',c:'#f2d03b',w:420,h:364,blurb:'Gobble every dot and dodge the ghosts.',hint:'Arrow keys or WASD to steer, or swipe on touch. Eat a big dot to turn the ghosts blue, then chase them. The side tunnel wraps around.',
free(c,r){return r>=0&&r<13&&MZ[r][(c+15)%15]!='#'},
pellets(){this.pl=MZ.map(s=>[...s].map(ch=>ch=='.'?1:ch=='o'?2:0));[[6,6],[7,6],[8,6],[7,9]].forEach(([c,r])=>this.pl[r][c]=0);this.left=this.pl.flat().filter(Boolean).length},
init(){this.sc=0;this.lv=3;this.over=0;this.s=1;this.pellets();this.rs()},
rs(){this.pm={c:7,r:9,dx:0,dy:0,p:0};this.wx=this.wy=0;this.fa=0;this.fr=0;this.pz=900;this.g=[0,1,2].map(i=>({c:6+i,r:6,dx:0,dy:0,p:0,t:600+i*2500,k:i}))},
dir(d){const a=this.pm;this.wx=d[0];this.wy=d[1];if((a.dx||a.dy)&&a.dx==-d[0]&&a.dy==-d[1]){a.c=(a.c+a.dx+15)%15;a.r+=a.dy;a.dx=d[0];a.dy=d[1];a.p=1-a.p}},
key(k){const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[k];if(m)this.dir(m)},swipe(d){this.dir(d)},
mv(a,dt,sp,pick){if(!a.dx&&!a.dy){const d=pick(a);if(!d)return;a.dx=d[0];a.dy=d[1]}
a.p+=sp*dt;while(a.p>=1){a.p-=1;a.c=(a.c+a.dx+15)%15;a.r+=a.dy;const d=pick(a);if(d){a.dx=d[0];a.dy=d[1]}else{a.dx=a.dy=0;a.p=0;break}}},
gp(g){const D=[[1,0],[-1,0],[0,1],[0,-1]],a=this.pm;let o=D.filter(([x,y])=>this.free(g.c+x,g.r+y)&&!(x==-g.dx&&y==-g.dy&&(g.dx||g.dy)));if(!o.length)o=D.filter(([x,y])=>this.free(g.c+x,g.r+y));
if(this.fr>0||Math.random()>[.9,.7,.5][g.k])return o[Math.random()*o.length|0];
return o.sort((p,q)=>Math.hypot(g.c+p[0]-a.c,g.r+p[1]-a.r)-Math.hypot(g.c+q[0]-a.c,g.r+q[1]-a.r))[0]},
update(dt){if(this.over)return;if(this.pz>0){this.pz-=dt;return}
const a=this.pm;this.fr=Math.max(0,this.fr-dt);
this.mv(a,dt,.0055,q=>[[this.wx,this.wy],[q.dx,q.dy]].find(([x,y])=>(x||y)&&this.free(q.c+x,q.r+y)));
if(a.dx||a.dy)this.fa=Math.atan2(a.dy,a.dx);
const tc=a.p<.5?[a.c,a.r]:[(a.c+a.dx+15)%15,a.r+a.dy],v=this.pl[tc[1]][tc[0]];
if(v){this.pl[tc[1]][tc[0]]=0;this.left--;this.sc+=v==2?50:10;if(v==2){this.fr=6000;beep(300,.1)}else beep(this.left%2?220:260,.02)}
if(this.left<=0){this.s*=1.1;this.pellets();this.rs();return}
this.g.forEach(g=>{if(this.over||this.pz>0)return;if(g.t>0){g.t-=dt;return}
this.mv(g,dt,this.fr>0?.0032:.0045*this.s,q=>this.gp(q));
const gx=g.c+g.dx*g.p,gy=g.r+g.dy*g.p,px=a.c+a.dx*a.p,py=a.r+a.dy*a.p;
if(Math.hypot(gx-px,gy-py)<.6){if(this.fr>0){this.sc+=200;beep(900,.1);Object.assign(g,{c:7,r:6,dx:0,dy:0,p:0,t:1500})}else{this.lv--;beep(120,.4);if(this.lv<=0){this.over=1;save(this.n,this.sc)}else this.rs()}}})},
draw(){R(0,0,420,364,'#0f1222');MZ.forEach((s,r)=>[...s].forEach((ch,c)=>{if(ch=='#')R(c*28+2,r*28+2,24,24,'#2a3a9e');else{const v=this.pl[r][c];if(v==1)R(c*28+12,r*28+12,4,4,'#f5e6c8');else if(v==2){x.fillStyle='#f5e6c8';x.beginPath();x.arc(c*28+14,r*28+14,7,0,7);x.fill()}}}));
const a=this.pm,px=(a.c+a.dx*a.p+.5)*28,py=(a.r+a.dy*a.p+.5)*28,m=.05+.3*Math.abs(Math.sin(performance.now()/110));
x.fillStyle='#f2d03b';x.beginPath();x.moveTo(px,py);x.arc(px,py,12,this.fa+m*3.14,this.fa+6.28-m*3.14);x.fill();
this.g.forEach(g=>{const gx=(g.c+g.dx*g.p+.5)*28,gy=(g.r+g.dy*g.p+.5)*28;x.fillStyle=this.fr>0?(this.fr<2000&&(this.fr/200|0)%2?'#ecebf5':'#3b4fd8'):['#ef6f6c','#f2a6d8','#5ad1e6'][g.k];x.beginPath();x.arc(gx,gy-1,11,3.14,6.28);x.lineTo(gx+11,gy+11);x.lineTo(gx-11,gy+11);x.fill();R(gx-6,gy-4,4,5,'#fff');R(gx+2,gy-4,4,5,'#fff')});
Tx('Lives '+this.lv,50,20,14,'#ecebf5')}};

/* ---------- Shell ---------- */
const games=[ttt,snake,tetris,dino,pong,brk,t48,mine,flap,pac];
let G=null,raf,last=0,pd;
function render(){const s=$('#shelf');s.innerHTML='';games.forEach((g,i)=>{const b=document.createElement('button');b.className='cart';b.style.setProperty('--c',g.c);b.innerHTML='<i></i><div class="lab"><b>'+g.n+'</b><span>'+g.blurb+'</span><em>Best '+best(g.n)+'</em></div>';b.onclick=()=>play(i);s.append(b)})}
function fit(){if(G)cv.style.width=Math.max(200,Math.min(G.w*1.3,innerWidth-48,(innerHeight-200)*G.w/G.h))+'px'}
function play(i){G=games[i];G.init();cv.width=G.w;cv.height=G.h;cv.style.borderColor=G.c;$('#gt').textContent=G.n;$('#hint').textContent=G.hint;$('#home').hidden=1;$('#stage').hidden=0;fit();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function home(){cancelAnimationFrame(raf);G=null;$('#stage').hidden=1;$('#home').hidden=0;render()}
function loop(t){if(!G)return;raf=requestAnimationFrame(loop);const dt=Math.min(50,t-last);last=t;G.update(dt);x.clearRect(0,0,cv.width,cv.height);G.draw();
if(G.over){R(0,0,cv.width,cv.height,'rgba(10,12,24,.72)');Tx(G.msg||'Game over',cv.width/2,cv.height/2-8,Math.min(32,cv.width/9),'#fff');Tx('Space or tap to play again',cv.width/2,cv.height/2+22,14,'#c9cbe0')}
$('#sc').textContent=Math.floor(G.sc);$('#best').textContent=Math.max(best(G.n),Math.floor(G.sc))}
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
const nk=e=>e.key.length>1?e.key:e.key.toLowerCase();
addEventListener('keydown',e=>{if(!G)return;const k=nk(e);if(k=='Escape')return home();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();if(G.over){if(k==' '||k=='Enter')G.init();return}G.key(k)});
addEventListener('keyup',e=>{if(G&&G.up)G.up(nk(e))});
cv.addEventListener('pointerdown',e=>{if(G.over){G.init();pd=0;return}pd=[e.clientX,e.clientY,pt(e)]});
cv.addEventListener('pointermove',e=>{if(G&&G.move)G.move(...pt(e))});
cv.addEventListener('pointerup',e=>{if(!pd||!G)return;const dx=e.clientX-pd[0],dy=e.clientY-pd[1];if(Math.hypot(dx,dy)<14){if(G.tap)G.tap(...pd[2])}else if(G.swipe)G.swipe(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]);pd=0});
addEventListener('resize',fit);
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(G&&G.alt&&!G.over)G.alt(...pt(e))});
$('#back').onclick=home;
$('#snd').onclick=e=>{mute=!mute;e.target.textContent='Sound: '+(mute?'off':'on')};
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
